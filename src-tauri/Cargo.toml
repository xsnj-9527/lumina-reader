[package]
name = "lumina-reader"
version = "0.1.0"
description = "Lumina Reader — 极简专注阅读与 AI 伴读"
authors = ["Lumina Reader"]
edition = "2021"

[lib]
name = "lumina_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
